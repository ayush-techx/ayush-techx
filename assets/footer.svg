<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" width="900" height="120"
     role="img" aria-labelledby="fTitle fDesc" preserveAspectRatio="xMidYMid meet">
  <title id="fTitle">Building things that should exist</title>
  <desc id="fDesc">Closing panel. Circuit traces run in from both edges toward the centred phrase
  "Building things that should exist", with a pulse of light travelling along each trace. Below it,
  the loop: learn, build, ship, measure, break, rebuild.</desc>

  <defs>
    <linearGradient id="fPanel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#05070A"/><stop offset="0.5" stop-color="#0B1016"/>
      <stop offset="1" stop-color="#05070A"/>
    </linearGradient>
    <clipPath id="fClip"><rect x="0" y="0" width="900" height="120" rx="14"/></clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
    .pulse { animation: run 4.2s linear infinite; }
    .pulseR { animation: run 4.2s linear infinite; animation-delay: 2.1s; }
    @keyframes run { from { stroke-dashoffset: 1000 } to { stroke-dashoffset: 0 } }
    @media (prefers-reduced-motion: reduce) {
      .pulse,.pulseR { animation: none; opacity: 0; }
    }
  </style>

  <g clip-path="url(#fClip)">
    <rect width="900" height="120" fill="url(#fPanel)"/>

    <!-- left trace -->
    <path id="fL" d="M0 50 H118 L140 30 H244 L266 50 H322" fill="none" stroke="#1E2A38" stroke-width="1.6"/>
    <path class="pulse" d="M0 50 H118 L140 30 H244 L266 50 H322" fill="none" stroke="#22D3EE"
          stroke-width="1.8" pathLength="1000" stroke-dasharray="70 930" stroke-linecap="round"/>
    <!-- right trace -->
    <path d="M900 50 H782 L760 30 H656 L634 50 H578" fill="none" stroke="#1E2A38" stroke-width="1.6"/>
    <path class="pulseR" d="M900 50 H782 L760 30 H656 L634 50 H578" fill="none" stroke="#22D3EE"
          stroke-width="1.8" pathLength="1000" stroke-dasharray="70 930" stroke-linecap="round"/>

    <g fill="#0B1016" stroke="#1E2A38" stroke-width="1.4">
      <circle cx="140" cy="30" r="3.4"/><circle cx="244" cy="30" r="3.4"/>
      <circle cx="656" cy="30" r="3.4"/><circle cx="760" cy="30" r="3.4"/>
    </g>

    <text class="sans" x="450" y="56" font-size="16" text-anchor="middle" fill="#E6EDF3">Building things that should exist.</text>
    <text class="mono" x="450" y="92" font-size="10" letter-spacing="1.6" text-anchor="middle" fill="#8B98A5">LEARN &#8594; BUILD &#8594; SHIP &#8594; MEASURE &#8594; BREAK &#8594; REBUILD</text>

    <rect x="0.5" y="0.5" width="899" height="119" rx="14" fill="none" stroke="#16202B"/>
  </g>
</svg>
