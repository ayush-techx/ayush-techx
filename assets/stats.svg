      <rect x="151.4" y="132" width="10" height="10" rx="2" fill="#4C8DFF"/><text class="mono lg" x="169.4" y="141" fill="#E6EDF3">JavaScript</text><text class="mono lg" x="169.4" y="158" fill="#8B98A5">19.1%</text>
      <rect x="270.9" y="132" width="10" height="10" rx="2" fill="#FFB547"/><text class="mono lg" x="288.9" y="141" fill="#E6EDF3">HTML</text><text class="mono lg" x="288.9" y="158" fill="#8B98A5">13.8%</text>
      <rect x="390.3" y="132" width="10" height="10" rx="2" fill="#7C8CF8"/><text class="mono lg" x="408.3" y="141" fill="#E6EDF3">CSS</text><text class="mono lg" x="408.3" y="158" fill="#8B98A5">3.1%</text>
