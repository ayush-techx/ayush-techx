<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220"
     role="img" aria-labelledby="stTitle stDesc" preserveAspectRatio="xMidYMid meet">
  <title id="stTitle">Language distribution across public repositories</title>
  <desc id="stDesc">Stacked bar showing language distribution by bytes across 5 public
  repositories: JavaScript 42.7 percent, Java 18.0 percent, CSS 15.3 percent, HTML 14.8 percent, C++ 9.2 percent. Generated from the GitHub API on 2026-09-06. Private and in-progress
  work is not included.</desc>
  <defs>
    <linearGradient id="stPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1016"/><stop offset="1" stop-color="#05070A"/>
    </linearGradient>
    <clipPath id="stClip"><rect x="0" y="0" width="900" height="220" rx="14"/></clipPath>
    <clipPath id="stBar"><rect x="32" y="78" width="836" height="22" rx="11"/></clipPath>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .lg { font-size: 11.5px; letter-spacing: 0.3px; }
  </style>
  <g clip-path="url(#stClip)">
    <rect width="900" height="220" fill="url(#stPanel)"/>
    <text class="mono" x="32" y="42" font-size="12.5" letter-spacing="3" fill="#8B98A5">// PUBLIC REPOSITORY TELEMETRY</text>
    <text class="mono" x="868" y="42" font-size="10.5" letter-spacing="1.2" text-anchor="end" fill="#8B98A5">UPDATED 2026-09-06</text>
    <text class="mono" x="32" y="66" font-size="10.5" letter-spacing="1.2" fill="#22D3EE">LANGUAGE DISTRIBUTION BY BYTES</text>
    <g clip-path="url(#stBar)">
      <rect x="32" y="78" width="836" height="22" fill="#0E141C"/>
      <rect x="32.00" y="78" width="356.73" height="22" fill="#22D3EE"/>
      <rect x="388.73" y="78" width="150.68" height="22" fill="#4C8DFF"/>
      <rect x="539.41" y="78" width="128.00" height="22" fill="#FFB547"/>
      <rect x="667.41" y="78" width="123.89" height="22" fill="#7C8CF8"/>
      <rect x="791.30" y="78" width="76.70" height="22" fill="#5EEAD4"/>
    </g>
    <rect x="32" y="78" width="836" height="22" rx="11" fill="none" stroke="#1E2A38"/>
    <g>
      <rect x="32.0" y="132" width="10" height="10" rx="2" fill="#22D3EE"/><text class="mono lg" x="50.0" y="141" fill="#E6EDF3">JavaScript</text><text class="mono lg" x="50.0" y="158" fill="#8B98A5">42.7%</text>
      <rect x="199.2" y="132" width="10" height="10" rx="2" fill="#4C8DFF"/><text class="mono lg" x="217.2" y="141" fill="#E6EDF3">Java</text><text class="mono lg" x="217.2" y="158" fill="#8B98A5">18.0%</text>
      <rect x="366.4" y="132" width="10" height="10" rx="2" fill="#FFB547"/><text class="mono lg" x="384.4" y="141" fill="#E6EDF3">CSS</text><text class="mono lg" x="384.4" y="158" fill="#8B98A5">15.3%</text>
      <rect x="533.6" y="132" width="10" height="10" rx="2" fill="#7C8CF8"/><text class="mono lg" x="551.6" y="141" fill="#E6EDF3">HTML</text><text class="mono lg" x="551.6" y="158" fill="#8B98A5">14.8%</text>
      <rect x="700.8" y="132" width="10" height="10" rx="2" fill="#5EEAD4"/><text class="mono lg" x="718.8" y="141" fill="#E6EDF3">C++</text><text class="mono lg" x="718.8" y="158" fill="#8B98A5">9.2%</text>
    </g>
    <line x1="32" y1="180" x2="868" y2="180" stroke="#16202B"/>
    <text class="mono" x="32" y="200" font-size="10" letter-spacing="1.1" fill="#8B98A5">5 PUBLIC REPOSITORIES &#183; LAST PUSH 2026-09-06 &#183; PRIVATE AND IN-PROGRESS WORK NOT INCLUDED</text>
    <rect x="0.5" y="0.5" width="899" height="219" rx="14" fill="none" stroke="#16202B"/>
