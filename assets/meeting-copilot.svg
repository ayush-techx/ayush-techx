<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320"
     role="img" aria-labelledby="mTitle mDesc" preserveAspectRatio="xMidYMid meet">
  <title id="mTitle">Meeting Copilot — local-first meeting intelligence pipeline</title>
  <desc id="mDesc">Signal-flow diagram. Meeting audio enters as a waveform and is processed on the
  local device by Whisper speech recognition plus context and memory. A dashed vertical boundary
  separates the local device from the network; only beyond that boundary does a thin backend relay
  pass requests to an LLM provider, which may be Ollama, Groq, OpenAI or Anthropic. Outputs shown
  along the bottom: live transcript, in-meeting suggestion, meeting memory, and summary with key
  points. A status badge reads private beta, waitlist open.</desc>

  <defs>
    <linearGradient id="mPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1016"/><stop offset="1" stop-color="#05070A"/>
    </linearGradient>
    <radialGradient id="mGlow" cx="0.28" cy="0.35" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="mClip"><rect x="0" y="0" width="900" height="320" rx="14"/></clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
    .bar { animation: vu 1.5s ease-in-out infinite; }
    .b1 { animation-delay: 0s }    .b2 { animation-delay: .12s } .b3 { animation-delay: .24s }
    .b4 { animation-delay: .36s }  .b5 { animation-delay: .48s } .b6 { animation-delay: .60s }
    .b7 { animation-delay: .72s }  .b8 { animation-delay: .84s } .b9 { animation-delay: .96s }
    .fdot { animation: hop 2.4s linear infinite; }
    .fd2 { animation-delay: .8s } .fd3 { animation-delay: 1.6s }
    .bound { animation: march 1.4s linear infinite; }
    .cardGlow { animation: soft 5s ease-in-out infinite; }
    @keyframes vu { 0%,100% { transform: scaleY(.35) } 50% { transform: scaleY(1) } }
    @keyframes hop { 0% { transform: translateX(0); opacity: 0 } 20% { opacity: 1 }
                     80% { opacity: 1 } 100% { transform: translateX(18px); opacity: 0 } }
    @keyframes march { to { stroke-dashoffset: -12 } }
    @keyframes soft { 0%,100% { opacity: .10 } 50% { opacity: .28 } }
    @media (prefers-reduced-motion: reduce) {
      .bar,.fdot,.bound,.cardGlow { animation: none; }
      .bar { transform: scaleY(.7) }
      .fdot { opacity: .9 }
      .cardGlow { opacity: .18 }
    }
  </style>

  <g clip-path="url(#mClip)">
    <rect width="900" height="320" fill="url(#mPanel)"/>
    <rect width="900" height="320" fill="url(#mGlow)"/>

    <!-- header -->
    <text class="sans" x="32" y="44" font-size="23" font-weight="700" letter-spacing="1.6" fill="#E6EDF3">MEETING COPILOT</text>
    <line x1="286" y1="26" x2="286" y2="52" stroke="#1E2A38"/>
    <text class="mono" x="302" y="35" font-size="11" letter-spacing="1.3" fill="#22D3EE">REAL-TIME MEETING INTELLIGENCE</text>
    <text class="mono" x="302" y="50" font-size="11" letter-spacing="1.3" fill="#8B98A5">LOCAL-FIRST DESKTOP CLIENT</text>
    <rect x="676" y="25" width="192" height="26" rx="13" fill="#0E141C" stroke="#1E2A38"/>
    <circle cx="695" cy="38" r="3.5" fill="#22D3EE"/>
    <text class="mono" x="708" y="42" font-size="10" letter-spacing="0.4" fill="#8B98A5">PRIVATE BETA &#183; WAITLIST</text>

    <!-- local / network boundary -->
    <line class="bound" x1="442" y1="68" x2="442" y2="160" stroke="#22D3EE" stroke-opacity="0.5"
          stroke-width="1.4" stroke-dasharray="6 6"/>
    <text class="mono" x="432" y="76" font-size="9.5" letter-spacing="1.2" text-anchor="end" fill="#22D3EE">LOCAL DEVICE</text>
    <text class="mono" x="452" y="76" font-size="9.5" letter-spacing="1.2" fill="#4C8DFF">NETWORK</text>

    <!-- 1. audio waveform -->
    <rect x="32" y="84" width="124" height="62" rx="6" fill="#0E141C" stroke="#1E2A38"/>
    <g fill="#22D3EE" opacity="0.9">
      <rect class="bar b1" x="44"  y="99" width="6" height="32" rx="2" style="transform-origin:47px 131px"/>
      <rect class="bar b2" x="58"  y="99" width="6" height="32" rx="2" style="transform-origin:61px 131px"/>
      <rect class="bar b3" x="72"  y="99" width="6" height="32" rx="2" style="transform-origin:75px 131px"/>
      <rect class="bar b4" x="86"  y="99" width="6" height="32" rx="2" style="transform-origin:89px 131px"/>
      <rect class="bar b5" x="100" y="99" width="6" height="32" rx="2" style="transform-origin:103px 131px"/>
      <rect class="bar b6" x="114" y="99" width="6" height="32" rx="2" style="transform-origin:117px 131px"/>
      <rect class="bar b7" x="128" y="99" width="6" height="32" rx="2" style="transform-origin:131px 131px"/>
      <rect class="bar b8" x="142" y="99" width="6" height="32" rx="2" style="transform-origin:145px 131px"/>
    </g>
    <text class="mono" x="94" y="160" font-size="9.5" letter-spacing="1" text-anchor="middle" fill="#8B98A5">MEETING AUDIO</text>

    <!-- link 1 -->
    <line x1="156" y1="115" x2="176" y2="115" stroke="#1E2A38" stroke-width="1.5"/>
    <circle class="fdot" cx="158" cy="115" r="2.4" fill="#22D3EE"/>

    <!-- 2. local processing -->
    <rect x="176" y="84" width="246" height="62" rx="6" fill="#0E141C" stroke="#22D3EE" stroke-opacity="0.55"/>
    <text class="mono" x="192" y="108" font-size="12" letter-spacing="1" fill="#22D3EE">LOCAL PROCESSING</text>
    <text class="mono" x="192" y="130" font-size="10" letter-spacing="0.6" fill="#8B98A5">WHISPER ASR &#183; CONTEXT &#183; MEMORY</text>

    <!-- link 2 across the boundary -->
    <line x1="422" y1="115" x2="478" y2="115" stroke="#1E2A38" stroke-width="1.5"/>
    <circle class="fdot fd2" cx="452" cy="115" r="2.4" fill="#4C8DFF"/>

    <!-- 3. relay -->
    <rect x="478" y="84" width="140" height="62" rx="6" fill="#0B1016" stroke="#4C8DFF" stroke-opacity="0.45"/>
    <text class="mono" x="494" y="108" font-size="12" letter-spacing="1" fill="#4C8DFF">THIN RELAY</text>
    <text class="mono" x="494" y="130" font-size="10" letter-spacing="0.6" fill="#8B98A5">NO KEYS IN CLIENT</text>

    <!-- link 3 -->
    <line x1="618" y1="115" x2="638" y2="115" stroke="#1E2A38" stroke-width="1.5"/>
    <circle class="fdot fd3" cx="620" cy="115" r="2.4" fill="#4C8DFF"/>

    <!-- 4. providers -->
    <rect x="638" y="84" width="230" height="62" rx="6" fill="#0B1016" stroke="#1E2A38"/>
    <text class="mono" x="654" y="108" font-size="12" letter-spacing="1" fill="#8B98A5">LLM PROVIDER</text>
    <text class="mono" x="654" y="130" font-size="10" letter-spacing="0.4" fill="#4C8DFF">OLLAMA / GROQ / OPENAI / ANTHROPIC</text>

    <!-- output bus -->
    <path d="M299 146 V170" stroke="#1E2A38" stroke-width="1.5" fill="none"/>
    <line x1="132" y1="170" x2="786" y2="170" stroke="#1E2A38" stroke-width="1.5"/>
    <g stroke="#1E2A38" stroke-width="1.5">
      <line x1="132" y1="170" x2="132" y2="186"/>
      <line x1="350" y1="170" x2="350" y2="186"/>
      <line x1="568" y1="170" x2="568" y2="186"/>
      <line x1="786" y1="170" x2="786" y2="186"/>
    </g>

    <!-- outputs -->
    <rect class="cardGlow" x="26" y="180" width="212" height="86" rx="9" fill="#22D3EE" opacity="0.12"/>
    <rect x="32" y="186" width="200" height="74" rx="6" fill="#0E141C" stroke="#1E2A38"/>
    <text class="mono" x="48" y="212" font-size="11.5" letter-spacing="0.9" fill="#22D3EE">LIVE TRANSCRIPT</text>
    <text class="sans" x="48" y="234" font-size="11" fill="#8B98A5">On-device, editable</text>

    <rect x="250" y="186" width="200" height="74" rx="6" fill="#0E141C" stroke="#1E2A38"/>
    <text class="mono" x="266" y="212" font-size="11.5" letter-spacing="0.9" fill="#22D3EE">SUGGESTION</text>
    <text class="sans" x="266" y="234" font-size="11" fill="#8B98A5">Hotkey or auto-detect</text>

    <rect x="468" y="186" width="200" height="74" rx="6" fill="#0E141C" stroke="#1E2A38"/>
    <text class="mono" x="484" y="212" font-size="11.5" letter-spacing="0.9" fill="#22D3EE">MEETING MEMORY</text>
    <text class="sans" x="484" y="234" font-size="11" fill="#8B98A5">Past meetings as context</text>

    <rect x="686" y="186" width="200" height="74" rx="6" fill="#0E141C" stroke="#1E2A38"/>
    <text class="mono" x="702" y="212" font-size="11.5" letter-spacing="0.9" fill="#22D3EE">SUMMARY</text>
    <text class="sans" x="702" y="234" font-size="11" fill="#8B98A5">Key points, stored local</text>

    <text class="mono" x="32" y="292" font-size="10" letter-spacing="1.1" fill="#8B98A5">TRANSCRIPTION AND MEETING HISTORY STAY ON THE DEVICE BY DEFAULT</text>

    <rect x="0.5" y="0.5" width="899" height="319" rx="14" fill="none" stroke="#16202B"/>
  </g>
</svg>
