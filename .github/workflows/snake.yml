name: Generate contribution snake

on:
  schedule:
    # Daily at 03:17 UTC. Off the hour on purpose — scheduled runs cluster at :00.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Render contribution grid as an animated SVG
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          # Snake colour matches the profile accent (#22D3EE).
          outputs: |
            dist/snake-light.svg?color_snake=%230E7490
            dist/snake-dark.svg?palette=github-dark&color_snake=%2322D3EE

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
